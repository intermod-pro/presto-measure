[project]
name = "presto-measure"
version = "0.1.0"
authors = [
    {name = "Intermodulation Products AB", email = "support@intermod.pro"},
]
description = "Collection of measurement and analysis scripts for the Presto platform"
license = "MIT"

requires-python = ">= 3.12"
dependencies = [
    "h5py >= 3.11",
    "matplotlib >= 3.9",
    "numpy >= 2.0",
    "scipy >= 1.12",
    "tomlkit >= 0.13",
    "intermod-presto",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ruff]
extend-exclude = ["bak/", "data/"]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["presto"]
known-local-folder = ["_base"]

[tool.uv]
config-settings-package = { intermod-presto = { editable_mode = "compat" } }

[tool.uv.sources]
intermod-presto = { path = "../presto-api", editable = true }
